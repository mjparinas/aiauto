name: Release

# Builds the APK and publishes it as a GitHub release.
# Start it from the Actions tab (Run workflow, then enter a version like v0.2.0), or push a tag like v0.2.0.
# Auto-release toggle: set the repository variable AUTO_RELEASE to true (Settings, Secrets and variables, Actions,
# Variables) and every pull request merged into main publishes the next patch version, e.g. v0.4.4 to v0.4.5.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create, like v0.2.0
        required: true
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Merges that land close together get consecutive versions instead of racing for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged && vars.AUTO_RELEASE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - name: Pick version
        id: version
        env:
          REQUESTED: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "tag=v$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "aiauto-$TAG.apk"
          gh release create "$TAG" "aiauto-$TAG.apk" --title "AIAuto $TAG" --target "$TARGET" --generate-notes
