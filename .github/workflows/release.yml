name: Release

# Builds the APK and publishes it as a GitHub release.
# Start it from the Actions tab (Run workflow, then enter a version like v0.2.0), or push a tag like v0.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create, like v0.2.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: ./gradlew :core:test :app:assembleRelease --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "aiauto-$TAG.apk"
          gh release create "$TAG" "aiauto-$TAG.apk" --title "AIAuto $TAG" --target "$GITHUB_SHA" --generate-notes
